# BlindHub main menu.
#
# Two-WAV layout (trunk v5.7.6+ greeting/prompt split):
#
#   greeting   plays ONCE before the <Gather> on a fresh
#              menu hit (no Digits). Skipped on
#              invalid-digit replays so a caller who
#              fat-fingers doesn't sit through the 24-second
#              welcome again.
#   prompt     short menu-options narration, played inside
#              the <Gather> so the first DTMF interrupts.
#
# Cross-tenant options (cobd.ca's operator extensions + main
# menu) point at absolute URLs back to the cobd.ca tenant
# slot -- same trunk instance, different team. Internal
# options (/documents/...) resolve under THIS team's
# base_url.
greeting: /audio/blindhub-greeting.wav
prompt: /audio/mainmenu.wav
numDigits: 3
options:
  '1': /documents/bh-en-coming-soon
  '2': /documents/support-french
  '3': https://phone.apps.blindhub.ca/v1/teams/cobd.ca/extensions/052
  '9': https://phone.apps.blindhub.ca/v1/teams/cobd.ca/menus/mainmenu
  '0': https://phone.apps.blindhub.ca/v1/teams/cobd.ca/extensions/100
