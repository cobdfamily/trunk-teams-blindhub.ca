# Language selector for blindhub.ca.
#
# Mirrors the shape of cobd.ca's languages.yaml: prompt
# (welcome + "press N for X" rolled into one) and a small
# options dict where each top-level digit picks a language.
#
# Entry point: cobd.ca extension 482's redirect_url drops
# the caller here (trunk v5.7.22). Anyone hitting this URL
# directly (eventually: blindhub.ca's own DID at the
# SignalWire layer) lands here too.
#
# Press-0 default operator is the English operator (ext 100)
# routed via blindhub's team_extensions_base_url fallback.
# The language-specific mainmenus each have their own
# press-0 wired to the language-matching operator
# (mainmenu.en -> 100, mainmenu.fr -> 033, mainmenu.es ->
# 052) -- so a caller who picks a language THEN presses 0
# gets the right operator.
prompt: /audio/blindhub-greeting.wav
numDigits: 3
timeout: 2
options:
  '1': /menus/mainmenu.en
  '2': /menus/mainmenu.fr
  '3': /menus/mainmenu.es
  # Default-language operator (English).
  '0': /extensions/100
