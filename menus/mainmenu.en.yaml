# BlindHub English main menu.
#
# Reached from /menus/languages option 1. Until the
# English content options are recorded, the menu just
# tells the caller BlindHub is "coming soon" and routes
# operator-dial (0) to cobd.ca ext 100 via blindhub's
# team_extensions_base_url fallback.
#
# prompt_text is TTS via talkshow; voice + multilingual
# auto-detection comes from team.yaml's talkshow_params
# (Brian Multilingual Neural). Inside-Gather playback
# (trunk v5.7.15+) so a caller who knows where they're
# going can press 0 during the prompt.
#
# Press 8 returns to the language selector; the
# silent-loop guard (v5.7.23) auto-hangs after three
# unattended renders.
prompt_text: "BlindHub is coming soon. Please call again soon. Or, to speak to a member of our team, press 0."
numDigits: 3
timeout: 7
options:
  # English-language operator -- routes via
  # team_extensions_base_url to cobd.ca's ext 100.
  '0': /extensions/100
  # Back to the language selector.
  '8': /menus/languages
