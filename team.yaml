# Team-level config for blindhub.ca.
#
# The blindhub.ca tenant has no PBX of its own -- its menu's
# operator-dial options (0, 9) cross-tenant-redirect to
# cobd.ca's PBX-backed extensions. No ``pbx:`` block needed
# here; if blindhub.ca later wires up its own SignalWire
# trunk, add the block per trunk's SCHEMA.md.
#
# Twilio / SignalWire signature verification is OFF until the
# operator wires real tokens. Trunk reads this file lazily on
# each request -- edits land on the next call without a
# restart.

signature_verification:
  enabled: false
  auth_tokens: []

# v5.7.21: when a request to /v1/teams/blindhub.ca/extensions/N
# (direct hit OR a menu dial-through) finds no local
# profile.yaml, trunk 302s here -- onto cobd.ca's extension
# tree on the same trunk. Saves us from copy-pasting every
# extensions/<n>/profile.yaml across two repos.
#
# Origin-relative shape so the value isn't pinned to a
# specific public hostname (works for the prod hostname,
# staging, dev, anywhere this trunk runs). The bare-team-
# name shape (`cobd.ca`) would also work; explicit
# /v1/teams/... makes the destination obvious to anyone
# reading the file.
team_extensions_base_url: /v1/teams/cobd.ca
